name: Deploy admin to VM

# On push to main, build the tenant-admin SPA (same-origin API via Caddy, tenant
# from the *.admin.devifai.in subdomain) and sync it to /opt/rg-admin on the VM,
# where Caddy serves it for every <slug>.admin.devifai.in host. Replaces the old
# Vercel deploy (disconnect the Vercel Git integration for this repo).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VM_HOST    → VM public IP or <dashed-ip>.sslip.io (e.g. 34-93-133-182.sslip.io)
#   VM_USER    → SSH user on the VM
#   VM_SSH_KEY → private key whose public half is authorized on the VM
# Optional repo variables (Settings → Variables):
#   VITE_ADMIN_ROOT → default "admin.devifai.in"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install + build (VM env)
        env:
          # Empty API base → SPA uses relative /api, which Caddy proxies to the
          # backend on the same origin (no CORS). Tenant root drives subdomain
          # tenant detection.
          VITE_API_BASE: ""
          VITE_ADMIN_ROOT: ${{ vars.VITE_ADMIN_ROOT || 'admin.devifai.in' }}
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync build to VM (/opt/rg-admin)
        run: |
          # Stage into a temp dir the SSH user can write, then move into place
          # with sudo (the SSH user isn't the file owner of /opt/rg-admin).
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            dist/ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/rg-admin-new/"
          ssh -i ~/.ssh/id_deploy "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          sudo mkdir -p /opt/rg-admin
          sudo rsync -a --delete /tmp/rg-admin-new/ /opt/rg-admin/
          rm -rf /tmp/rg-admin-new
          sudo test -f /opt/rg-admin/index.html && echo "admin deployed OK" || (echo "index.html missing"; exit 1)
          EOF

      - name: Smoke test (admin served on VM)
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash -s <<'EOF'
          # Verify Caddy serves the SPA for a tenant admin host over loopback TLS.
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            --resolve rudraganga.admin.devifai.in:443:127.0.0.1 \
            https://rudraganga.admin.devifai.in/ || true)
          echo "admin SPA HTTP $code"
          [ "$code" = "200" ] && exit 0 || (echo "admin not served"; exit 1)
          EOF
